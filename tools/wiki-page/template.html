<title>LifeGame Field Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,500&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: a field journal — sticky contents rail on the left, one reading column of pages on the right; stacks on phones. */
:root{
  --bg:#EDF1EA; --surface:#F7F9F5; --ink:#1E2A22; --muted:#56655A; --rule:#CBD5C8;
  --moss:#3F6B34; --ember:#B85A24;
  --display:"Alegreya",Georgia,"Times New Roman",serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131915; --surface:#1A221D; --ink:#E2E9E0; --muted:#9AAA9C; --rule:#2E3A31;
  --moss:#8DBA77; --ember:#E08A52; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131915; --surface:#1A221D; --ink:#E2E9E0; --muted:#9AAA9C; --rule:#2E3A31;
  --moss:#8DBA77; --ember:#E08A52; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:400 17px/1.65 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.wrap{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:56px;padding-block:48px 72px}
header.top{grid-column:1/-1;border-bottom:1px solid var(--rule);padding-bottom:28px}
.kicker{font:600 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--moss);margin:0 0 14px}
h1{font:700 clamp(36px,6vw,56px)/1.05 var(--display);margin:0 0 16px;text-wrap:balance}
.lede{font:500 21px/1.5 var(--display);max-width:38em;margin:0 0 10px}
.note{color:var(--muted);max-width:40em;margin:0}
nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 24px);align-self:start}
nav ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
nav a{display:flex;gap:10px;align-items:baseline;padding:6px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:15px}
nav a:hover,nav a:focus-visible{background:var(--surface);color:var(--moss)}
nav a:focus-visible{outline:2px solid var(--moss);outline-offset:1px}
.n{font:500 13px var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
main{min-width:0;max-width:40em}
section{padding-block:8px 36px;border-bottom:1px dashed var(--rule);margin-bottom:36px;scroll-margin-top:24px}
section:last-child{border-bottom:0}
.eyebrow{font:600 12px/1.4 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
h2{font:700 32px/1.15 var(--display);margin:0 0 14px;text-wrap:balance}
h3{font:700 21px/1.3 var(--display);margin:26px 0 6px;color:var(--moss)}
p{margin:0 0 14px}
ul,ol{margin:0 0 16px;padding-left:1.3em}
li{margin-bottom:6px}
li::marker{color:var(--moss)}
strong{font-weight:600}
code{font:15px ui-monospace,Menlo,Consolas,monospace;background:var(--surface);border:1px solid var(--rule);padding:1px 5px;border-radius:4px}
main a{color:var(--moss)}
#controls strong{color:var(--ember)}
.tbl{overflow-x:auto;margin:6px 0 20px;border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:16px}
th{text-align:left;font:600 12px/1.4 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--rule)}
td{padding:9px 14px;border-bottom:1px solid var(--rule);vertical-align:top}
tr:last-child td{border-bottom:0}
td.k{width:40%;color:var(--muted)}
kbd{display:inline-block;min-width:1.7em;padding:1px 7px;margin:1px 1px;text-align:center;font:600 13px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-bottom-width:2px;border-radius:5px}
.plus{color:var(--muted);margin:0 2px}
@media (max-width:480px){td.k{width:auto}}
footer{grid-column:1/-1;color:var(--muted);font-size:14px;border-top:1px solid var(--rule);padding-top:20px}
@media (max-width:760px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:28px;padding-block:28px 48px}
  nav{position:static}
  nav ol{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
<div class="wrap">
<header class="top">
  <p class="kicker">Player wiki · light on spoilers</p>
  <h1>LifeGame Field Guide</h1>
  <p class="lede">{{LEDE}}</p>
  <p class="note">{{NOTE}}</p>
</header>
<nav aria-label="Pages"><ol>
{{NAV}}
</ol></nav>
<main>
{{SECTIONS}}
</main>
<footer>{{FOOT}}</footer>
</div>
